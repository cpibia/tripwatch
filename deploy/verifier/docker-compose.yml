# tripwatch verifier: ingest endpoint for the sensors (mTLS, public) and web interface (HTTP,
# bound to localhost: publish it through an HTTPS reverse proxy).
#
#   cp .env.example .env    # then edit it
#   docker compose up -d
#   (umask 077; docker compose exec -T verifier /tripwatch-verifier enroll -host web-01 -out - > web-01.json)
#
# To build the image from a checkout instead of pulling the release:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  verifier:
    image: ghcr.io/cpibia/tripwatch-verifier:${TRIPWATCH_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # The Go runtime collects harder near this, below the container's memory limit.
      GOMEMLIMIT: 700MiB
    ports:
      - "${TRIPWATCH_INGEST_PORT:-8443}:8443"
      - "127.0.0.1:${TRIPWATCH_UI_PORT:-8080}:8080"
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  # Database, certificate authority and baselines. Back it up: losing it means enrolling every
  # host again.
  data:
