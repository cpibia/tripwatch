{{define "content"}}{{$d := .Data}}
<div class="login">
  <p class="brand"><img src="/static/logo.png" width="32" height="32" alt=""><span>tripwatch</span></p>
  <h1>Code from your app</h1>
  {{with $d.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login/2fa" class="form">
    <input type="hidden" name="next" value="{{$d.Next}}">
    <label for="code">Six-digit code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required class="mono" autofocus>
    <p class="help">Lost the phone? A recovery code works here too, once.</p>
    <button class="primary" type="submit">Continue</button>
  </form>
</div>
{{end}}
