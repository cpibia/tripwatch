{{define "content"}}
<div class="login">
  <p class="brand"><img src="/static/logo.png" width="32" height="32" alt=""><span>tripwatch</span></p>
  <h1>Sign in with a link</h1>
  <p class="note">The link works once. Signing in makes this browser one of those whose sign-in is never slowed down.</p>
  <form method="post" action="/login/link" class="form">
    <input type="hidden" name="t" value="{{.Data}}">
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{{end}}
