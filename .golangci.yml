version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      # User-facing text of the verifier is Italian; these words are correct there.
      ignore-rules: [cancellato, certificato, compreso, modificato, persistente, presentato, registrato]
  exclusions:
    rules:
      # Doc comments are written where they add information, not on every exported name.
      - linters: [revive]
        text: "^exported:"

formatters:
  enable:
    - gofmt
    - goimports
