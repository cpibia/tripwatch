name: release

on:
  push:
    tags: ['v*']

# Same pinning as ci.yml. Every artifact gets a signed build provenance attestation, so anyone
# can check with `gh attestation verify` that a package or image was built here from this tag.
# GoReleaser publishes a draft; the release becomes public, and visible to sensors, only after
# the sensors built here and the previous release's sensors accept its provenance bundle.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: make cover

  packages:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The release notes are the tag's section of CHANGELOG.md; a tag without one fails here.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } /^\[[^]]*\]: / { next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # Sensors fetch the bundle from the release: they verify it offline, without GitHub's API.
      - name: Attach the provenance bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.sigstore.json
          gh release upload "$GITHUB_REF_NAME" dist/provenance.sigstore.json
      # A bundle the fleet cannot verify would leave every sensor unable to update: the release
      # stops here, as a draft, instead.
      - name: Sensors accept the provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release files under the names they are published with (GoReleaser keeps binaries
          # under their build directory), so each is checked against its own subject.
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          jq -r '.[] | select(.type == "Binary" or .type == "Linux Package") | select(.name | startswith("tripwatch-sensor")) | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r path name; do cp "$path" "$release/$name"; done
          files=()
          while read -r name; do
            test -f "$release/$name" || { echo "$name is in SHA256SUMS but was not built"; exit 1; }
            files+=("$release/$name")
          done < <(awk '$2 ~ /^tripwatch-sensor/ { print $2 }' dist/SHA256SUMS)
          new="$release/tripwatch-sensor_${version}_linux_amd64"
          chmod +x "$new"
          "$new" -verify-provenance dist/provenance.sigstore.json -release "$version" "${files[@]}"

          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          prev="${previous#v}"
          if ! gh release view "$previous" --json assets --jq '.assets[].name' | grep -qx provenance.sigstore.json; then
            echo "$previous predates provenance verification: only the new sensor is checked"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$previous" -D "$RUNNER_TEMP/previous" -p provenance.sigstore.json -p "tripwatch-sensor_${prev}_linux_amd64"
          old="$RUNNER_TEMP/previous/tripwatch-sensor_${prev}_linux_amd64"
          "$new" -verify-provenance "$RUNNER_TEMP/previous/provenance.sigstore.json" -release "$prev" "$old"
          chmod +x "$old"
          "$old" -verify-provenance dist/provenance.sigstore.json -release "$version" "${files[@]}"

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tripwatch-verifier
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/verifier/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.commit.outputs.short }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tripwatch-verifier
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    runs-on: ubuntu-latest
    needs: [packages, image]
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
